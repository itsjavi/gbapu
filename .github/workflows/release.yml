# Publishes a release. `pnpm release:version <x.y.z>` commits the version and tags it vX.Y.Z;
# pushing the tag runs this workflow: it checks the package, verifies that the tag matches
# package.json's version and publishes to npm with provenance (x.y.z-* versions under the `next`
# dist-tag), then creates the tag's GitHub release with its CHANGELOG.md section.
# npm trusts this workflow (trusted publishing, configured on the package's npm settings), so no
# token is involved: npm exchanges the job's OIDC identity for a one-off publish credential.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it would write an .npmrc with a token line, and a token must never
      # stand in for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check that npm supports trusted publishing (11.5.1 or later)
        run: |
          version="$(npm --version)"
          if [[ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]]; then
            echo "::error::npm $version is too old for trusted publishing (11.5.1 or later)."
            exit 1
          fi
          echo "npm $version"

      - name: Check that the tag is v + package.json's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::The tag $TAG does not match package.json's version $version."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A version npm already has (published by hand, or a re-run) is skipped, so the GitHub
          # release still follows.
          version="${TAG#v}"
          if npm view "gbaudio@$version" version >/dev/null 2>&1; then
            echo "gbaudio@$version is already on npm: nothing to publish."
            exit 0
          fi
          flags=(--provenance --access public)
          if [[ "$TAG" == *-* ]]; then flags+=(--tag next); fi
          npm publish "${flags[@]}"

  # A job of its own, so that a failure here can be re-run without publishing again.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release-notes.ts "$TAG" > "$notes"
          flags=(--title "$TAG" --notes-file "$notes" --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
